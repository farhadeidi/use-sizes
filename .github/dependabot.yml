version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Expo SDK pins react, react-native and expo-* versions in the example;
      # bump those together with `npx expo install --fix` instead.
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: "@expo/*"
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-web

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
